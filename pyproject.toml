[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotd"
version = "0.1.0"
description = "机器人统一控制与配置服务"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.81,<2", "protobuf>=6.33.5,<7", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.81,<1.82", "ruff>=0.12"]

[project.scripts]
robotd = "robotd.server:main"
robotctl = "robotd.client:main"

[tool.setuptools]
packages = ["robotd", "robotd.pb", "h7.tools"]
include-package-data = false

[tool.setuptools.package-data]
robotd = ["proto/*.proto", "pb/*.proto", "examples/*.json", "examples/*.py",
          "deploy/*.service", "README.md"]

[tool.ruff]
line-length = 100
exclude = ["robotd/pb", "h7", "eyes", ".reference"]
