[package]
name = "eyes"
version = "0.1.0"
edition = "2024"
description = "Procedural anime eye display with iFacialMocap tracking"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "x11"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "vulkan", "gles", "wgsl"] }
bytemuck = { version = "1.24", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
naga = { version = "27", features = ["wgsl-in"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros", "signal"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
uds-compat = "0.1"
async-stream = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14.1"
signal-hook = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
strip = true

